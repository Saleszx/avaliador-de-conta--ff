<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Avaliador do Saleszx</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg, #0f172a, #1e293b);
  color: white;
  text-align: center;
  padding: 20px;
}

.container {
  background: #1e293b;
  padding: 20px;
  border-radius: 15px;
  max-width: 400px;
  margin: auto;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

h2 {
  margin-bottom: 5px;
}

p {
  opacity: 0.7;
  font-size: 14px;
}

input, select, button {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border-radius: 10px;
  border: none;
  font-size: 14px;
}

button {
  background: #3b82f6;
  color: white;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: #2563eb;
}

.resultado {
  margin-top: 20px;
  font-size: 18px;
}

.loading {
  animation: piscar 1s infinite;
}

@keyframes piscar {
  0% {opacity: 1;}
  50% {opacity: 0.3;}
  100% {opacity: 1;}
}
</style>
</head>

<body>

<div class="container">
<h2>🔥 Avaliador do Saleszx</h2>
<p>@saleszx</p>

<input type="text" id="id" placeholder="Digite seu ID">

<select id="raridade">
  <option value="0">Tem skins raras?</option>
  <option value="100">Sim (+100)</option>
  <option value="0">Não</option>
</select>

<select id="armas">
  <option value="0">Tem armas evoluídas?</option>
  <option value="150">Sim (+150)</option>
  <option value="0">Não</option>
</select>

<select id="passe">
  <option value="0">Tem passe antigo?</option>
  <option value="80">Sim (+80)</option>
  <option value="0">Não</option>
</select>

<select id="rank">
  <option value="0">Qual rank?</option>
  <option value="50">Diamante (+50)</option>
  <option value="100">Mestre (+100)</option>
  <option value="200">Desafiante (+200)</option>
</select>

<button onclick="avaliar()">Avaliar Conta</button>

<div class="resultado" id="resultado"></div>

<p style="margin-top:20px; font-size:12px;">
Estimativa não oficial. Não afiliado à Garena.
</p>

</div>

<script>
function avaliar() {
  let id = document.getElementById("id").value;

  if(id === "") {
    alert("Digite o ID primeiro!");
    return;
  }

  let raridade = parseInt(document.getElementById("raridade").value);
  let armas = parseInt(document.getElementById("armas").value);
  let passe = parseInt(document.getElementById("passe").value);
  let rank = parseInt(document.getElementById("rank").value);

  let total = raridade + armas + passe + rank;
  let valor = total * 2;

  let res = document.getElementById("resultado");

  res.innerHTML = "<span class='loading'>🔍 Buscando dados...</span>";

  setTimeout(() => {
    res.innerHTML = "<span class='loading'>📊 Analisando conta...</span>";
  }, 1000);

  setTimeout(() => {
    res.innerHTML = "<span class='loading'>💰 Calculando valor...</span>";
  }, 2000);

  setTimeout(() => {
    res.innerHTML =
    "🔍 ID: " + id + "<br><br>" +
    "📊 Detalhes:<br>" +
    "- Skins: +" + raridade + "<br>" +
    "- Armas: +" + armas + "<br>" +
    "- Passe: +" + passe + "<br>" +
    "- Rank: +" + rank + "<br><br>" +
    "💰 Valor estimado: R$" + valor;
  }, 3000);
}
</script>

</body>
</html>
